# CI sized for the GitHub Free plan (2,000 min/month for private repos; Windows minutes count double).
# - Every push / PR: tests only, on Linux (cheap).
# - Platform builds: only for `v*` tags or a manual run (workflow_dispatch).
# - Tags additionally publish a GitHub Release with all builds attached.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Newer pushes cancel older test runs of the same branch, but never a manual or tag build.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION_FILE: app/pubspec.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true
      - name: Install native libraries for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: core – format, analyze, test
        working-directory: packages/core
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: app – format, analyze, test
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package
        run: tar -czf timetrack-linux-x64.tar.gz -C app/build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: timetrack-linux-x64.tar.gz
          retention-days: 7

  build-android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true
      - name: Restore release keystore (optional)
        # Without the secrets the APK is signed with the debug key (fine for testing, see docs/dev-setup.md).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          echo "$ANDROID_KEY_PROPERTIES" > app/android/key.properties
      - name: Build
        working-directory: app
        run: flutter build apk --release
      - name: Rename
        run: cp app/build/app/outputs/flutter-apk/app-release.apk timetrack-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: timetrack-android.apk
          retention-days: 7

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath timetrack-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: timetrack-windows-x64.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            timetrack-linux-x64.tar.gz
            timetrack-android.apk
            timetrack-windows-x64.zip

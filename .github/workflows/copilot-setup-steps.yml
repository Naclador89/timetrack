# Prepares the environment for GitHub Copilot's coding agent so it can run
# `dart test` / `flutter test` like any other contributor (see AGENTS.md).
# The job name must stay `copilot-setup-steps`.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev
      - name: Fetch dependencies
        run: |
          (cd packages/core && dart pub get)
          (cd app && flutter pub get)

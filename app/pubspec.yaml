name: timetrack
description: "TimeTrack: working hours, projects, home office and travel. Android, Linux, Windows."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  # Pinned Flutter version; CI reads it via `flutter-version-file` (keep in sync with docs/dev-setup.md).
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  timetrack_core:
    path: ../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: timetrack
description: "TimeTrack: working hours, projects, home office and travel. Android, Linux, Windows."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0
  # Pinned Flutter version; CI reads it via `flutter-version-file` (keep in sync with docs/dev-setup.md).
  flutter: 3.47.9

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  home_widget: ^0.10.0
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  sqlite3: ^3.9.0
  timetrack_core:
    path: ../packages/core
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

name: timetrack
description: "TimeTrack: working hours, projects, home office and travel. Android, Linux, Windows."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  # Pinned Flutter version; CI reads it via `flutter-version-file` (keep in sync with docs/dev-setup.md).
  flutter: 3.47.9

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: ^0.20.3
  timetrack_core:
    path: ../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
